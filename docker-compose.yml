services:
  db:
    image: postgres:16-alpine
    container_name: mercado-local-db
    environment:
      POSTGRES_USER: mercado
      POSTGRES_PASSWORD: mercado
      POSTGRES_DB: mercado_local
    ports:
      - "5432:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercado -d mercado_local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dados_postgres:
