{% extends "base.html" %}
{% block titulo %}Área do produtor · Mercado Local{% endblock %}

{% block conteudo %}
<section class="pagina-larga">
    <div id="area-login" {% if logado %}hidden{% endif %}>
        <div class="pagina-estreita">
            <h1>Área do produtor</h1>
            <p>Entre para gerenciar os pedidos.</p>
            <form id="form-login" class="form-pedido">
                <label>E-mail <input name="email" type="email" required autocomplete="username"></label>
                <label>Senha <input name="senha" type="password" required autocomplete="current-password"></label>
                <p id="erro-login" class="erro" role="alert"></p>
                <button type="submit" class="botao-principal">Entrar</button>
            </form>
        </div>
    </div>

    <div id="painel" {% if not logado %}hidden{% endif %}>
        <div class="painel-cabecalho">
            <h1>Pedidos</h1>
            <div class="painel-acoes">
                <label>Estado
                    <select id="filtro-estado">
                        <option value="">Todos</option>
                        <option>Recebido</option>
                        <option>Em preparação</option>
                        <option>Saiu para entrega</option>
                        <option>Entregue</option>
                        <option>Cancelado</option>
                    </select>
                </label>
                <button id="botao-sair" class="botao-secundario" type="button">Sair</button>
            </div>
        </div>
        <div class="tabela-rolagem">
            <table class="tabela">
                <thead>
                    <tr>
                        <th>Código</th><th>Data</th><th>Cliente</th><th>Itens</th>
                        <th>Entrega</th><th class="num">Total</th><th>Estado</th>
                    </tr>
                </thead>
                <tbody id="tabela-pedidos"></tbody>
            </table>
        </div>
        <p id="sem-pedidos" class="vazio" hidden>Nenhum pedido encontrado.</p>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script src="/static/js/admin.js"></script>
{% endblock %}
